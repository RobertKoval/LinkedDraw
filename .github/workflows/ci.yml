name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Restore package-lock state
        run: npm ci --ignore-scripts
      - name: Audit npm metadata
        run: npm audit --audit-level=high
      - name: Run deterministic checks
        run: npm run check

  chromium-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-e2e.txt
      - name: Install E2E tooling
        run: |
          npm ci --ignore-scripts
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium
      - name: Run unpacked Chromium test
        run: xvfb-run -a npm run e2e:chromium

  release-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [check, chromium-e2e]
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - name: Restore package-lock state
        run: npm ci --ignore-scripts
      - name: Build release archives
        run: npm run release
      - name: Upload unsigned archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linked-draw-unsigned-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
