name: Bug report
description: Report a reproducible LinkedDraw defect
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, cookies, signed media URLs, private profile HTML, or personal screenshots.
  - type: input
    id: version
    attributes:
      label: LinkedDraw version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: Chrome 151 on macOS 14.5
    validations:
      required: true
  - type: input
    id: language
    attributes:
      label: LinkedIn interface language
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and sanitized console output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, tokens, cookies, private HTML, signed URLs, and personal screenshots.
          required: true
