name: Feature request
description: Propose a focused user-facing improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the problem before proposing implementation details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Privacy, permission, or browser-compatibility impact
