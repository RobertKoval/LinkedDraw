<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LinkedDraw</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="brand">
      <img src="../icons/icon-48.png" width="40" height="40" alt="">
      <div>
        <h1 data-i18n="popupTitle">LinkedDraw</h1>
        <p data-i18n="popupDescription">Draw directly on your LinkedIn profile cover.</p>
      </div>
    </div>
    <div id="status" class="status" aria-live="polite"></div>
    <button id="primary" class="primary" type="button" data-i18n="openEditor">Draw on cover</button>
    <button id="options" class="secondary" type="button" data-i18n="options">Settings</button>
  </main>
  <script src="../shared/constants.js"></script>
  <script src="../shared/browser-api.js"></script>
  <script src="../shared/i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
